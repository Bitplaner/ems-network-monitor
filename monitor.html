<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMS Ring Monitor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0f;
  color: #e2e8f0;
  font-family: 'SF Mono', monospace;
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-rows: 46px 1fr 32px;
  grid-template-columns: 1fr 220px 260px;
  gap: 6px;
  padding: 6px;
}

/* Header */
#header {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between;
  background: #111827; border-radius: 8px; padding: 0 14px;
  border: 1px solid #1f2937;
}
#header .title { font-size: 17px; font-weight: 700; color: #f1f5f9; }
#header .meta  { font-size: 13px; color: #6b7280; }
#status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; margin-right: 8px; flex-shrink: 0; }
#status-dot.err { background: #f87171; animation: blink 1s infinite; }

/* Ring canvas area */
#ring-area {
  grid-column: 1; grid-row: 2;
  background: #0d1117; border-radius: 10px; border: 1px solid #1f2937;
  position: relative; overflow: hidden;
}
svg#ring-svg { width: 100%; height: 100%; }

/* Side panel */
#panel-dev {
  grid-column: 2; grid-row: 2;
  background: #111827; border-radius: 10px; border: 1px solid #1f2937;
  padding: 8px; overflow: hidden; display: flex; flex-direction: column;
}
#panel-ap {
  grid-column: 3; grid-row: 2;
  background: #111827; border-radius: 10px; border: 1px solid #1f2937;
  padding: 8px; overflow: hidden; display: flex; flex-direction: column;
}
.side-title { font-size: 11px; text-transform: uppercase; color: #4b5563; letter-spacing: 1px; margin-bottom: 6px; flex-shrink: 0; }
.dev-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 3px 0; border-bottom: 1px solid #1a1f2e; }
.dev-row:last-child { border-bottom: none; }
.dev-name { color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.dot-on  { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
.dot-off { width: 8px; height: 8px; border-radius: 50%; background: #f87171; flex-shrink: 0; animation: blink 1s infinite; }
.rtt { color: #6b7280; font-size: 11px; min-width: 36px; text-align: right; }

/* Footer */
#footer {
  grid-column: 1 / 4;
  background: #111827; border-radius: 6px; border: 1px solid #1f2937;
  display: flex; align-items: center; padding: 0 14px; gap: 18px; font-size: 13px; color: #6b7280;
}
#footer span { color: #94a3b8; }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* Ring node styles */
.sw-node { cursor: default; }
.sw-circle { transition: all 0.3s; }
.sw-circle.up   { fill: #0d2b1a; stroke: #166534; }
.sw-circle.down { fill: #2b0d0d; stroke: #7f1d1d; animation: blink 1s infinite; }
.sw-circle.unknown { fill: #1a1a2e; stroke: #374151; }
.sw-label { fill: #e2e8f0; font-size: 15px; font-weight: 700; text-anchor: middle; pointer-events: none; }
.sw-sublabel { fill: #94a3b8; font-size: 11px; text-anchor: middle; pointer-events: none; }
.sw-ip { fill: #4b5563; font-size: 9px; text-anchor: middle; pointer-events: none; }

/* Ring link */
.ring-link { stroke-width: 2; fill: none; transition: stroke 0.3s; }
.ring-link.up   { stroke: #166534; }
.ring-link.down { stroke: #7f1d1d; stroke-dasharray: 6; animation: blink 0.8s infinite; }
.ring-link.blocked { stroke: #854d0e; stroke-dasharray: 4 4; }
.ring-link.unknown { stroke: #374151; stroke-dasharray: 2 4; }

/* BW label on links */
.bw-label-bg { fill: #0d1117; rx: 3; }
.bw-text { fill: #60a5fa; font-size: 11px; text-anchor: middle; pointer-events: none; }
.bw-text-tx { fill: #a78bfa; font-size: 11px; text-anchor: middle; pointer-events: none; }

/* STP blocked indicator */
.stp-badge { fill: #854d0e; font-size: 7px; text-anchor: middle; }
</style>
</head>
<body>

<div id="header">
  <div style="display:flex;align-items:center">
    <div id="status-dot"></div>
    <span class="title">EMS Glasfaser-Ring</span>
  </div>
  <div class="meta" id="ts">–</div>
  <div class="meta"><a href="index.html" style="color:#4b5563;text-decoration:none">→ Vollansicht</a></div>
</div>

<div id="ring-area">
  <svg id="ring-svg" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid meet">
    <!-- Links werden per JS gezeichnet -->
    <g id="links"></g>
    <!-- Nodes werden per JS gezeichnet -->
    <g id="nodes"></g>
    <!-- BW Labels -->
    <g id="bw-labels"></g>
  </svg>
</div>

<div id="panel-dev">
  <div class="side-title">Geräte</div>
  <div id="dev-list" style="overflow-y:auto;flex:1"></div>
</div>

<div id="panel-ap">
  <div class="side-title">Access Points</div>
  <div id="ap-list" style="overflow-y:auto;flex:1"></div>
</div>

<div id="footer">
  <span id="ft-ok">–</span>
  <span id="ft-err">–</span>
  <span id="ft-age">–</span>
  <span style="margin-left:auto;color:#374151">EMS Network Monitor</span>
</div>

<script>
const GITHUB_REPO = 'Bitplaner/ems-network-monitor';

// Ring-Topologie: 7 Switches, Reihenfolge im Ring
// Jeder Eintrag: { id, name, short, ip }
// Verbindungen: tg0/25 geht zum NÄCHSTEN Switch im Ring (tg0/26 des Nachbarn)
const SWITCHES = [
  { id: 0, ip: '10.10.1.1', short: 'SW1', name: 'Regie' },
  { id: 1, ip: '10.10.1.2', short: 'SW2', name: 'VIP' },
  { id: 2, ip: '10.10.1.3', short: 'SW3', name: '2.Stage' },
  { id: 3, ip: '10.10.1.4', short: 'SW4', name: 'Cashless' },
  { id: 4, ip: '10.10.1.5', short: 'SW5', name: 'hinterBar2' },
  { id: 5, ip: '10.10.1.6', short: 'SW6', name: 'zw.Bar&amp;Partner' },
  { id: 6, ip: '10.10.1.7', short: 'SW7', name: 'FOH' },
];

// Positionen im SVG (Heptagon, 600x500, Mittelpunkt 300,245, Radius 175)
const N = 7;
const CX = 295, CY = 245, R = 185;
const positions = SWITCHES.map((_, i) => {
  // Start oben (SW1 oben mitte), im Uhrzeigersinn
  const angle = (i * 2 * Math.PI / N) - Math.PI / 2;
  return { x: CX + R * Math.cos(angle), y: CY + R * Math.sin(angle) };
});

// Segmente: [von-idx, tg-von, tg-nach]
// SW_i:tg0/25 → SW_(i+1):tg0/26
const SEGMENTS = SWITCHES.map((sw, i) => ({
  from: i,
  to: (i + 1) % N,
  port_from: 'tg0_25',
  port_to:   'tg0_26',
  bw_rx_key: 'bw_25_rx',
  bw_tx_key: 'bw_25_tx',
}));

const svg = document.getElementById('ring-svg');
const gLinks = document.getElementById('links');
const gNodes = document.getElementById('nodes');
const gBW    = document.getElementById('bw-labels');

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// Links zeichnen
const linkEls = SEGMENTS.map((seg, i) => {
  const p1 = positions[seg.from];
  const p2 = positions[seg.to];
  const line = svgEl('line', {
    x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
    class: 'ring-link unknown', 'stroke-width': 3
  });
  gLinks.appendChild(line);
  return line;
});

// BW Labels — je Seite der Linie: → (CW/tx) und ← (CCW/rx)
const bwEls = SEGMENTS.map((seg, i) => {
  const p1 = positions[seg.from];
  const p2 = positions[seg.to];
  const mx = (p1.x + p2.x) / 2;
  const my = (p1.y + p2.y) / 2;

  // Senkrechter Versatz zur Linie (16px)
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const ox = (-dy / len) * 16, oy = (dx / len) * 16;

  // CW-Label (→ tx): auf der "linken" Seite der Linie (Innenring)
  const bgCW = svgEl('rect', { x: mx+ox-24, y: my+oy-12, width: 48, height: 14, rx: 3, fill: '#0d1117', opacity: 0.9 });
  const tCW  = svgEl('text', { x: mx+ox, y: my+oy-1, class: 'bw-text' });
  tCW.textContent = '→–';

  // CCW-Label (← rx): auf der "rechten" Seite
  const bgCCW = svgEl('rect', { x: mx-ox-24, y: my-oy-2, width: 48, height: 14, rx: 3, fill: '#0d1117', opacity: 0.9 });
  const tCCW  = svgEl('text', { x: mx-ox, y: my-oy+9, class: 'bw-text-tx' });
  tCCW.textContent = '←–';

  gBW.appendChild(bgCW); gBW.appendChild(tCW);
  gBW.appendChild(bgCCW); gBW.appendChild(tCCW);
  return { tCW, tCCW };
});

// Nodes zeichnen
const nodeEls = SWITCHES.map((sw, i) => {
  const { x, y } = positions[i];
  const r = 42;

  const circle = svgEl('circle', { cx: x, cy: y, r, class: 'sw-circle unknown', 'stroke-width': 2 });
  const label  = svgEl('text',   { x, y: y - 4, class: 'sw-label' });
  const sub    = svgEl('text',   { x, y: y + 11, class: 'sw-sublabel' });
  const ip     = svgEl('text',   { x, y: y + 23, class: 'sw-ip' });

  label.textContent = sw.short;
  sub.textContent   = sw.name;
  ip.textContent    = sw.ip;

  const g = svgEl('g', { class: 'sw-node' });
  g.appendChild(circle); g.appendChild(label); g.appendChild(sub); g.appendChild(ip);
  gNodes.appendChild(g);
  return { circle };
});

function fmtBW(v) {
  if (v === undefined || v === null) return '–';
  if (v >= 1000) return (v/1000).toFixed(1)+'G';
  if (v >= 0.1)  return v.toFixed(1)+'M';
  return '0';
}

function linkStatus(ring, seg) {
  const r = ring.find(r => r.ip === SWITCHES[seg.from].ip);
  if (!r) return 'unknown';
  const s = r[seg.port_from];
  if (s === 'up') return 'up';
  if (s === 'down') return 'down';
  return 'unknown';
}

function render(data) {
  const ring = data.ring_ports || [];
  const devs = data.devices    || [];
  const aps  = data.access_points || [];

  // Status dot
  const dot = document.getElementById('status-dot');
  dot.className = data.all_ok ? '' : 'err';

  // Timestamp
  document.getElementById('ts').textContent = data.timestamp_de || '';

  // Nodes
  SWITCHES.forEach((sw, i) => {
    const dev = devs.find(d => d.ip === sw.ip);
    const online = dev ? dev.online : null;
    nodeEls[i].circle.setAttribute('class',
      'sw-circle ' + (online === true ? 'up' : online === false ? 'down' : 'unknown'));
  });

  // Links + BW
  SEGMENTS.forEach((seg, i) => {
    const rFrom = ring.find(r => r.ip === SWITCHES[seg.from].ip);
    const rTo   = ring.find(r => r.ip === SWITCHES[seg.to].ip);
    const portStatus = rFrom ? (rFrom[seg.port_from] || 'unknown') : 'unknown';
    // STP: check blocking on outgoing port (from) or incoming port (to=tg0_26)
    const stpFrom = rFrom ? rFrom['stp_25'] : null;
    const stpTo   = rTo   ? rTo['stp_26']   : null;
    const blocked = stpFrom === 'blocking' || stpTo === 'blocking';
    const status = blocked ? 'blocked' : portStatus;
    linkEls[i].setAttribute('class', 'ring-link ' + status);

    const rx = rFrom ? rFrom[seg.bw_rx_key] : null;
    const tx = rFrom ? rFrom[seg.bw_tx_key] : null;
    bwEls[i].tCW.textContent  = '→' + fmtBW(tx);
    bwEls[i].tCCW.textContent = '←' + fmtBW(rx);
  });

  // Gerätelist
  const devList = document.getElementById('dev-list');
  devList.innerHTML = devs.map(d => `
    <div class="dev-row">
      <span class="dev-name">${d.name.replace('EMS-FSN-','')}</span>
      <div class="${d.online ? 'dot-on' : 'dot-off'}"></div>
    </div>`).join('');

  // AP List
  const apList = document.getElementById('ap-list');
  apList.innerHTML = aps.map(a => `
    <div class="dev-row">
      <span class="dev-name">${a.name}</span>
      <span class="rtt">${a.online ? a.rtt+'ms' : ''}</span>
      ${a.clients > 0 ? `<span style="color:#60a5fa;font-size:11px;font-weight:700">${a.clients}👤</span>` : ''}
      <div class="${a.online ? 'dot-on' : 'dot-off'}"></div>
    </div>`).join('');

  // Footer
  const errs = data.errors || [];
  document.getElementById('ft-ok').textContent  = data.all_ok ? `✓ Alles OK${data.total_clients > 0 ? ' · '+data.total_clients+' 👤' : ''}` : `⚠ ${errs.length} Fehler`;
  document.getElementById('ft-err').textContent = errs.length ? errs[0].replace(/"/g,'') : '';

  // Age
  const sec = Math.round((new Date() - new Date(data.timestamp)) / 1000);
  document.getElementById('ft-age').textContent = `Daten: vor ${sec}s`;

  window._lastData = data;
}

async function fetchStatus() {
  try {
    const bust = Date.now();
    const res = await fetch(
      `https://bitplaner.github.io/ems-network-monitor/status.json?_=${bust}`,
      { cache: 'no-store' }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
  } catch(e) {
    if (window._lastData) render(window._lastData);
    console.error(e);
  }
}

fetchStatus();
setInterval(fetchStatus, 30000);
setInterval(() => {
  if (!window._lastData) return;
  const sec = Math.round((new Date() - new Date(window._lastData.timestamp)) / 1000);
  document.getElementById('ft-age').textContent = `Daten: vor ${sec}s`;
}, 5000);
</script>
</body>
</html>
