<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMS Network Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 20px;
  }

  .header {
    text-align: center;
    padding: 30px 20px 20px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .header .subtitle {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
    font-family: monospace;
  }

  /* Gesamtstatus Banner */
  .status-banner {
    max-width: 500px;
    margin: 20px auto;
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
    transition: all 0.4s ease;
  }

  .status-banner.ok {
    background: linear-gradient(135deg, #0d2b1a, #0a3320);
    border: 1px solid #1a5c35;
  }

  .status-banner.error {
    background: linear-gradient(135deg, #2b0d0d, #331010);
    border: 1px solid #5c1a1a;
  }

  .status-banner.loading {
    background: #1a1a2e;
    border: 1px solid #333;
  }

  .status-icon {
    font-size: 48px;
    margin-bottom: 10px;
  }

  .status-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .status-banner.ok .status-text { color: #4ade80; }
  .status-banner.error .status-text { color: #f87171; }
  .status-banner.loading .status-text { color: #888; }

  /* Fehler Liste */
  .errors {
    max-width: 500px;
    margin: 0 auto 20px;
    background: #1e0a0a;
    border: 1px solid #5c1a1a;
    border-radius: 12px;
    padding: 16px;
  }

  .errors h3 {
    color: #f87171;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .error-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #2a1010;
    font-size: 14px;
    color: #fca5a5;
  }

  .error-item:last-child { border-bottom: none; }
  .error-item::before { content: "⚠"; font-size: 16px; }

  /* Geräte Grid */
  .section-title {
    max-width: 500px;
    margin: 24px auto 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #555;
    font-weight: 600;
  }

  .devices {
    max-width: 500px;
    margin: 0 auto 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .device-card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #2a2a2a;
    transition: border-color 0.3s;
  }

  .device-card.online { border-color: #1a3a25; }
  .device-card.offline { border-color: #3a1a1a; }

  .device-info { flex: 1; }
  .device-name { font-size: 15px; font-weight: 600; color: #fff; }
  .device-ip { font-size: 12px; color: #555; font-family: monospace; margin-top: 2px; }

  .device-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
  }

  .device-badge.online {
    background: #0d2b1a;
    color: #4ade80;
    border: 1px solid #166534;
  }

  .device-badge.offline {
    background: #2b0d0d;
    color: #f87171;
    border: 1px solid #7f1d1d;
  }

  .device-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
    font-size: 11px;
    color: #4a90d9;
    text-decoration: none;
    font-family: monospace;
    opacity: 0.8;
  }
  .device-link:hover { opacity: 1; text-decoration: underline; }

  /* AP Section */
  .ap-card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #2a2a2a;
  }
  .ap-card.online { border-color: #1a3a25; }
  .ap-card.offline { border-color: #3a1a1a; }
  .ap-info { flex: 1; }
  .ap-name { font-size: 15px; font-weight: 600; color: #fff; }
  .ap-ip { font-size: 12px; color: #555; font-family: monospace; margin-top: 2px; }
  .ap-right { display: flex; align-items: center; gap: 10px; }
  .ap-rtt {
    font-size: 12px;
    font-family: monospace;
    color: #888;
    min-width: 50px;
    text-align: right;
  }
  .ap-rtt.fast { color: #4ade80; }
  .ap-rtt.slow { color: #fbbf24; }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .dot.online { background: #4ade80; animation: pulse-green 2s infinite; }
  .dot.offline { background: #f87171; }

  @keyframes pulse-green {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Ring Ports */
  .ring-cards {
    max-width: 500px;
    margin: 0 auto 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .ring-card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 14px 16px;
    border: 1px solid #2a2a2a;
  }

  .ring-card-header {
    font-size: 14px;
    font-weight: 600;
    color: #ccc;
    margin-bottom: 10px;
  }

  .ring-ports {
    display: flex;
    gap: 10px;
  }

  .port-badge {
    flex: 1;
    text-align: center;
    padding: 8px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    font-family: monospace;
  }

  .port-badge.up { background: #0d2b1a; color: #4ade80; border: 1px solid #166534; }
  .port-badge.down { background: #2b0d0d; color: #f87171; border: 1px solid #7f1d1d; animation: blink 1s infinite; }
  .port-badge.unknown { background: #1a1a2e; color: #666; border: 1px solid #333; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Fehler-Bestätigung */
  .error-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #2a1010;
    font-size: 14px;
    gap: 10px;
  }
  .error-item:last-child { border-bottom: none; }
  .error-text { display: flex; align-items: center; gap: 8px; flex: 1; color: #fca5a5; }
  .error-text::before { content: "⚠"; font-size: 16px; flex-shrink: 0; }
  .error-text.acked { color: #555; text-decoration: line-through; }
  .error-text.acked::before { content: "✓"; color: #4ade80; }

  .ack-btn {
    background: #2a1010;
    border: 1px solid #5c1a1a;
    color: #f87171;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .ack-btn:hover { background: #3a1a1a; border-color: #f87171; }
  .ack-btn.acked {
    background: #0d2b1a;
    border-color: #166534;
    color: #4ade80;
    cursor: pointer;
  }
  .ack-btn.acked:hover {
    background: #1a3a25;
    border-color: #4ade80;
  }

  /* Zeitstempel */
  .timestamp-bar {
    max-width: 500px;
    margin: 10px auto 30px;
    text-align: center;
    font-size: 12px;
    color: #444;
    font-family: monospace;
  }

  .timestamp-bar span { color: #666; }

  /* Refresh Indicator */
  .refresh-bar {
    max-width: 500px;
    margin: 0 auto 10px;
    height: 2px;
    background: #222;
    border-radius: 2px;
    overflow: hidden;
  }

  .refresh-progress {
    height: 100%;
    background: linear-gradient(90deg, #1d9e75, #4ade80);
    border-radius: 2px;
    transition: width 1s linear;
  }

  .offline-warning {
    max-width: 500px;
    margin: 0 auto 20px;
    background: #1a1a00;
    border: 1px solid #5c5000;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    color: #fbbf24;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <h1>EMS Network Monitor</h1>
  <div class="subtitle">FSN · Glasfaser-Ring · 7× S3400-24T4SP</div>
</div>

<div id="dataAgeBanner" style="display:none; max-width:500px; margin:10px auto 0; border-radius:12px; padding:11px 18px; text-align:center; font-size:14px; font-weight:600; font-family:monospace;"></div>

<div class="refresh-bar" style="margin-top:10px">
  <div class="refresh-progress" id="progressBar" style="width:100%"></div>
</div>

<div id="statusBanner" class="status-banner loading">
  <div class="status-icon">⏳</div>
  <div class="status-text">Lade Daten...</div>
</div>

<div id="offlineWarning" style="display:none" class="offline-warning">
  ⚠ Monitoring-System antwortet nicht — Daten möglicherweise veraltet
</div>

<div id="errorList"></div>

<div class="section-title">Geräte</div>
<div class="devices" id="deviceList"></div>

<div class="section-title">Glasfaser-Ring Ports</div>
<div class="ring-cards" id="ringList"></div>

<div class="section-title">Access Points</div>
<div class="devices" id="apList"></div>

<div class="timestamp-bar" id="timestamps">
  Letztes Update: <span id="lastUpdate">—</span><br>
  Nächster Check: <span id="nextCheck">—</span>
</div>

<script>
const GITHUB_REPO = 'Bitplaner/ems-network-monitor';
const REFRESH_INTERVAL = 60; // Sekunden für Webpage-Refresh
const DATA_MAX_AGE = 5 * 60; // 5 Min = Daten gelten als veraltet

let countdown = REFRESH_INTERVAL;
let progressInterval;

function formatAge(isoString) {
  const now = new Date();
  const then = new Date(isoString);
  const diffSec = Math.floor((now - then) / 1000);
  if (diffSec < 60) return `vor ${diffSec}s`;
  if (diffSec < 3600) return `vor ${Math.floor(diffSec/60)}min ${diffSec%60}s`;
  return `vor ${Math.floor(diffSec/3600)}h`;
}

function isDataStale(isoString) {
  const diffSec = (new Date() - new Date(isoString)) / 1000;
  return diffSec > DATA_MAX_AGE;
}

// ── Fehler-Bestätigung (localStorage) ────────────────────────────────────────
function getAcked() {
  try { return new Set(JSON.parse(localStorage.getItem('ackedErrors') || '[]')); }
  catch { return new Set(); }
}
function saveAcked(set) {
  localStorage.setItem('ackedErrors', JSON.stringify([...set]));
}
function getPrevErrors() {
  try { return new Set(JSON.parse(localStorage.getItem('prevErrors') || '[]')); }
  catch { return new Set(); }
}
function savePrevErrors(set) {
  localStorage.setItem('prevErrors', JSON.stringify([...set]));
}

function ackError(errText) {
  const acked = getAcked();
  acked.add(errText);
  saveAcked(acked);
  renderErrors(window._lastErrors || []);
  updateBanner(window._lastData);
}

function processErrors(currentErrors) {
  const acked = getAcked();
  const prev  = getPrevErrors();

  // Fehler die verschwunden waren und jetzt wieder da sind → Bestätigung löschen
  for (const err of currentErrors) {
    if (acked.has(err) && !prev.has(err)) {
      acked.delete(err);
    }
  }
  saveAcked(acked);
  savePrevErrors(new Set(currentErrors));
  return acked;
}

function renderErrors(errors) {
  const acked = getAcked();
  const errorDiv = document.getElementById('errorList');
  if (!errors || errors.length === 0) {
    errorDiv.innerHTML = '';
    // Event-Listener neu setzen nach innerHTML-Reset
    return;
  }
  errorDiv.innerHTML = `<div class="errors">
    <h3>Fehler</h3>
    ${errors.map((e, i) => {
      const isAcked = acked.has(e);
      return `<div class="error-item">
        <span class="error-text ${isAcked ? 'acked' : ''}">${e}</span>
        <button class="ack-btn ${isAcked ? 'acked' : ''}" data-idx="${i}">
          ${isAcked ? '✓ Bestätigt' : 'Bestätigen'}
        </button>
      </div>`;
    }).join('')}
  </div>`;

  // Event-Listener auf alle Buttons setzen — Klick togglet Bestätigung
  errorDiv.querySelectorAll('.ack-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      const err = errors[idx];
      const acked = getAcked();
      if (acked.has(err)) {
        acked.delete(err);
        saveAcked(acked);
      } else {
        ackError(err);
        return;
      }
      renderErrors(window._lastErrors || []);
      updateBanner(window._lastData);
    });
  });
}

function updateBanner(data) {
  if (!data) return;
  const acked   = getAcked();
  const errors  = data.errors || [];
  const stale   = isDataStale(data.timestamp);
  const allAcked = errors.length > 0 && errors.every(e => acked.has(e));
  const banner  = document.getElementById('statusBanner');

  if (stale) {
    banner.className = 'status-banner loading';
    banner.innerHTML = '<div class="status-icon">⏸</div><div class="status-text">Monitoring pausiert</div>';
  } else if (data.all_ok || allAcked) {
    banner.className = 'status-banner ok';
    banner.innerHTML = allAcked && !data.all_ok
      ? '<div class="status-icon">✅</div><div class="status-text">Fehler bestätigt</div>'
      : '<div class="status-icon">✅</div><div class="status-text">Alles Online</div>';
  } else {
    banner.className = 'status-banner error';
    banner.innerHTML = '<div class="status-icon">🔴</div><div class="status-text">Probleme erkannt</div>';
  }
}

function portBadge(status, name) {
  return `<div class="port-badge ${status}">
    ${name}<br>${status === 'up' ? '✓ UP' : status === 'down' ? '✗ DOWN' : '?'}
  </div>`;
}

async function fetchStatus() {
  try {
    // raw.githubusercontent.com mit Zufalls-Parameter → kein CDN-Cache, kein API-Limit
    const bust = Date.now();
    const res = await fetch(
      `https://raw.githubusercontent.com/${GITHUB_REPO}/main/status.json?_=${bust}`,
      { cache: 'no-store' }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const stale = isDataStale(data.timestamp);
    const ageStr = formatAge(data.timestamp);
    const diffSec = Math.floor((new Date() - new Date(data.timestamp)) / 1000);

    // Daten-Alter Banner oben
    const ageBanner = document.getElementById('dataAgeBanner');
    ageBanner.style.display = 'block';
    if (diffSec < 300) {
      ageBanner.style.background = '#0d2b1a';
      ageBanner.style.border = '1px solid #166534';
      ageBanner.style.color = '#4ade80';
      ageBanner.innerHTML = `🕐 Daten aktuell &nbsp;·&nbsp; ${ageStr} &nbsp;·&nbsp; ${data.timestamp_de}`;
    } else if (diffSec < 900) {
      ageBanner.style.background = '#1a1a00';
      ageBanner.style.border = '1px solid #5c5000';
      ageBanner.style.color = '#fbbf24';
      ageBanner.innerHTML = `⚠ Daten ${ageStr} alt &nbsp;·&nbsp; ${data.timestamp_de}`;
    } else {
      ageBanner.style.background = '#2b0d0d';
      ageBanner.style.border = '1px solid #7f1d1d';
      ageBanner.style.color = '#f87171';
      ageBanner.innerHTML = `🔴 Daten ${ageStr} alt — Monitor offline? &nbsp;·&nbsp; ${data.timestamp_de}`;
    }

    document.getElementById('offlineWarning').style.display = 'none';

    // Fehler verarbeiten (Bestätigungen prüfen)
    processErrors(data.errors || []);
    window._lastErrors = data.errors || [];
    window._lastData   = data;

    // Status Banner + Fehler rendern
    updateBanner(data);
    renderErrors(data.errors || []);

    // Geräte
    const deviceList = document.getElementById('deviceList');
    deviceList.innerHTML = (data.devices || []).map(d => `
      <div class="device-card ${d.online ? 'online' : 'offline'}">
        <div class="device-info">
          <div class="device-name">${d.name}</div>
          <div class="device-ip">${d.ip}</div>
          ${d.url ? `<a class="device-link" href="${d.url}" target="_blank">🔗 Web-UI öffnen</a>` : ''}
        </div>
        <div class="device-badge ${d.online ? 'online' : 'offline'}">
          <div class="dot ${d.online ? 'online' : 'offline'}"></div>
          ${d.online ? 'Online' : 'Offline'}
        </div>
      </div>
    `).join('');

    // Access Points
    const apList = document.getElementById('apList');
    const aps = data.access_points || [];
    if (aps.length === 0) {
      apList.innerHTML = '<div style="color:#444;font-size:13px;text-align:center;padding:10px">Keine APs konfiguriert</div>';
    } else {
      apList.innerHTML = aps.map(ap => {
        const rttClass = ap.rtt < 10 ? 'fast' : ap.rtt < 50 ? '' : 'slow';
        const rttText = ap.online ? `${ap.rtt} ms` : '—';
        return `
        <div class="device-card ${ap.online ? 'online' : 'offline'}">
          <div class="device-info">
            <div class="device-name">${ap.name}</div>
            <div class="device-ip">${ap.ip}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="ap-rtt ${rttClass}">${rttText}</span>
            <div class="device-badge ${ap.online ? 'online' : 'offline'}">
              <div class="dot ${ap.online ? 'online' : 'offline'}"></div>
              ${ap.online ? 'Online' : 'Offline'}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    // Ring Ports
    const ringList = document.getElementById('ringList');
    ringList.innerHTML = (data.ring_ports || []).map(r => `
      <div class="ring-card">
        <div class="ring-card-header">🔗 ${r.switch} <span style="color:#444;font-size:12px;font-family:monospace">${r.ip}</span></div>
        <div class="ring-ports">
          ${portBadge(r.tg0_25, 'tg0/25')}
          ${portBadge(r.tg0_26, 'tg0/26')}
        </div>
      </div>
    `).join('');

    // Timestamps
    document.getElementById('lastUpdate').textContent =
      `${data.timestamp_de} (${formatAge(data.timestamp)})`;

  } catch(e) {
    // Bei Fehler: alte Daten behalten, nur age-Banner updaten
    const ageBanner = document.getElementById('dataAgeBanner');
    if (window._lastData) {
      // Daten noch vorhanden → nur Banner aktualisieren
      const diffSec = Math.floor((new Date() - new Date(window._lastData.timestamp)) / 1000);
      const ageStr = formatAge(window._lastData.timestamp);
      ageBanner.style.display = 'block';
      ageBanner.style.background = '#1a1a00';
      ageBanner.style.border = '1px solid #5c5000';
      ageBanner.style.color = '#fbbf24';
      ageBanner.innerHTML = `⚠ Abruf fehlgeschlagen &nbsp;·&nbsp; Letzte Daten: ${ageStr}`;
    } else {
      document.getElementById('statusBanner').className = 'status-banner loading';
      document.getElementById('statusBanner').innerHTML =
        '<div class="status-icon">⚠</div><div class="status-text">Keine Verbindung</div>';
    }
    console.error(e);
  }
}

function startProgress() {
  clearInterval(progressInterval);
  countdown = REFRESH_INTERVAL;
  const bar = document.getElementById('progressBar');
  progressInterval = setInterval(() => {
    countdown--;
    bar.style.width = ((countdown / REFRESH_INTERVAL) * 100) + '%';
    document.getElementById('nextCheck').textContent = `in ${countdown}s`;
    if (countdown <= 0) {
      countdown = REFRESH_INTERVAL;
      fetchStatus();
    }
  }, 1000);
}

fetchStatus();
startProgress();
</script>
</body>
</html>
